name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Web CI (TypeScript, ESLint, Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 breaks jsdom/undici in Vitest forks workers
          # (webidl.util.markAsUncloneable); Node 22 is the verified runtime.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check (tsc)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Tests (Vitest)
        run: npm test

      - name: Security Audit (fail on critical)
        run: npm audit --audit-level=critical

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [web-check]

    defaults:
      run:
        working-directory: web

    env:
      # Placeholder values only — smoke specs assert public pages and
      # guard envelopes that hold without real Supabase credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test

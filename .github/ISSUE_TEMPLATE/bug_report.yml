---
name: Bug report
description: Something broken? Tell us what happened.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description, with steps to reproduce.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit SHA or deployment URL where you saw it.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant console output or screenshots. Never paste secrets or tokens.

---
name: Feature request
description: Propose an idea for the project.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who needs this and why? Field story welcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? API/UI sketches welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Photos / upload
        - Defects / work orders
        - Evidence / PDF / verify
        - Auth / RBAC / tenancy
        - i18n
        - Mobile / PWA
        - CI / docs
        - Other
